<!DOCTYPE html>

      content="Sub-second Next.js storefronts, Django backends, and technical SEO. Public builds, public numbers, and full source handover by Sagor Ahamed."
    />

    <!-- Zero-FOUC Theme Initialization -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Automatic Self-Healing for Stale Browser Cache & Service Worker -->
    <script>
      (function () {
        window.addEventListener('DOMContentLoaded', function () {
          var test = document.createElement('div');
          test.className = 'hidden';
          document.body.appendChild(test);
          var isCssLoaded = window.getComputedStyle(test).display === 'none';
          document.body.removeChild(test);

          if (!isCssLoaded) {
            console.warn('Stylesheet not applied. Auto-purging stale cache & unregistering SW...');
            if (!sessionStorage.getItem('css_purged_reload')) {
              sessionStorage.setItem('css_purged_reload', 'true');
              var promises = [];
              if ('serviceWorker' in navigator) {
                promises.push(
                  navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    return Promise.all(registrations.map(function (r) { return r.unregister(); }));
                  })
                );
              }
              if ('caches' in window) {
                promises.push(
                  caches.keys().then(function (names) {
                    return Promise.all(names.map(function (n) { return caches.delete(n); }));
                  })
                );
              }
              Promise.all(promises).then(function () {
                window.location.reload();
              }).catch(function () {
                window.location.reload();
              });
            }
          } else {
            sessionStorage.removeItem('css_purged_reload');
          }
        });
      })();
    </script>

    <!-- LCP is the hero heading; do not preload a 35KB avatar or 115KB of TTF into the critical path. -->
    <!-- Branded boot screen: covers the crawlable SSG shell until React paints. -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #090A0F; color: #F8FAFC;
      }
      #boot .boot-inner {
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot svg { width: 36px; height: 36px; }
      #boot .boot-name { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
      #boot .boot-line {
        width: 128px; height: 2px; border-radius: 2px; overflow: hidden;
        background: rgba(255,255,255,.12);
      }
      #boot .boot-line i {
        display: block; width: 42%; height: 100%; background: #818CF8;
        animation: boot-slide 1.15s cubic-bezier(.4,0,.2,1) infinite;
      }
      body.app-ready #boot { display: none; }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-line i { animation: none; width: 62%; }
      }
    </style>
    <noscript><style>#boot { display: none !important; }</style></noscript>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-[#090A0F] text-slate-900 dark:text-slate-50 antialiased overflow-x-hidden">
    <div id="boot" aria-hidden="true">

          <path d="M49 64H79" stroke="#818CF8" stroke-width="10" stroke-linecap="round"/>
        </svg>
        <span class="boot-name">CryptoWebBuild</span>
        <span class="boot-line"><i></i></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
